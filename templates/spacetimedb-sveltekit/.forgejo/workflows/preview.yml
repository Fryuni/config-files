name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-pr-${{ github.event.number }}
  # Queue instead of cancelling: Forgejo does not wait for a cancelled run to
  # stop, so a preview and a cleanup could otherwise race on the same resources.
  cancel-in-progress: false

env:
  PREVIEW_NAME: pr-${{ github.event.number }}
  PREVIEW_DATABASE: ${{ secrets.SPACETIMEDB_DATABASE }}-pr-${{ github.event.number }}

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: nix
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Publish SpacetimeDB preview module
        # Previews may clear their own data when the schema changes incompatibly.
        run: |
          config_dir="$(mktemp -d)"
          trap 'rm -rf "$config_dir"' EXIT
          nix develop -c spacetime --root-dir "$config_dir" login \
            --token "$SPACETIMEDB_TOKEN"
          nix develop -c spacetime --root-dir "$config_dir" publish \
            --server "$SPACETIMEDB_HOST" \
            --yes=all --delete-data=on-conflict \
            "$PREVIEW_DATABASE"
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
          SPACETIMEDB_HOST: ${{ secrets.SPACETIMEDB_HOST }}

      - name: Generate module bindings
        run: nix develop -c pnpm generate

      - name: Build client
        run: nix develop -c pnpm build
        env:
          PUBLIC_SPACETIMEDB_HOST: ${{ secrets.SPACETIMEDB_HOST }}
          PUBLIC_SPACETIMEDB_DB_NAME: ${{ env.PREVIEW_DATABASE }}

      - name: Deploy Cloudflare Worker preview
        run: nix develop -c pnpm exec wrangler preview --name "$PREVIEW_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cleanup:
    if: github.event.action == 'closed'
    runs-on: nix
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        id: install
        run: nix develop -c pnpm install

      - name: Delete Cloudflare Worker preview
        run: >-
          nix develop -c pnpm exec wrangler preview delete
          --name "$PREVIEW_NAME" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete SpacetimeDB preview database
        # Independent of the Cloudflare cleanup, so run even if it failed.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          config_dir="$(mktemp -d)"
          trap 'rm -rf "$config_dir"' EXIT
          nix develop -c spacetime --root-dir "$config_dir" login \
            --token "$SPACETIMEDB_TOKEN"
          if ! nix develop -c spacetime --root-dir "$config_dir" delete \
            --server "$SPACETIMEDB_HOST" --yes "$PREVIEW_DATABASE" 2>delete.err; then
            cat delete.err >&2
            # The preview job may have failed before creating the database.
            if grep -Fq "failed to find database \`$PREVIEW_DATABASE\`" delete.err; then
              echo "No SpacetimeDB preview $PREVIEW_DATABASE to delete"
              exit 0
            fi
            exit 1
          fi
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
          SPACETIMEDB_HOST: ${{ secrets.SPACETIMEDB_HOST }}
