name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: convex-preview-pr-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: nix
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Generate Convex types
        run: nix develop -c pnpm exec convex codegen --typecheck disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}

      - name: Deploy Convex backend preview
        run: >-
          nix develop -c pnpm exec convex deploy
          --preview-name "pr-${{ github.event.number }}" --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
