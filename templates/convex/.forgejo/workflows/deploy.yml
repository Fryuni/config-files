name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: convex-production

jobs:
  deploy:
    runs-on: nix
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Generate Convex types
        run: nix develop -c pnpm exec convex codegen --typecheck disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy Convex backend
        run: nix develop -c pnpm exec convex deploy --typecheck enable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
