name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production
  # Forgejo cancels by default; queue pushes instead of interrupting a deployment.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: nix
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: nix develop -c pnpm install

      - name: Generate Convex types
        run: nix develop -c pnpm exec convex codegen --typecheck disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy Convex backend and build client
        run: >-
          nix develop -c pnpm exec convex deploy --typecheck enable
          --cmd "pnpm build" --cmd-url-env-var-name PUBLIC_CONVEX_URL
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Deploy Cloudflare Worker
        run: nix develop -c pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
